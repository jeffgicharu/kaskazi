# Kaskazi Bank's products, prices and rules.
#
# Kaskazi Bank is invented. Every product, price, rate and rule here is sample data written for
# this demonstration. This file is the single source for figures: the bank's documents quote it,
# the core-banking service charges from it, and the evaluations check answers against it.
#
# Amounts are in Kenya shillings (KES) unless a field says otherwise. Rates are percentages.

[bank]
name = "Kaskazi Bank"
legal_name = "Kaskazi Bank Limited"
head_office_town = "Mombasa"
website = "kaskazi.example"
effective_date = 2026-10-01
base_rate = 11.5                       # Kaskazi Base Rate, % a year
contact_centre_hours = "24 hours a day, every day"
branch_hours_weekdays = "8:30 am to 4:30 pm, Monday to Friday"
branch_hours_saturday = "9:00 am to 12:00 noon on Saturday"
branch_closed = "Sundays and public holidays"
working_day = "Monday to Friday, except public holidays"
# A real bank would publish its phone number, email and USSD code. This one has none.
contact_note = "not available in this demonstration"

[[branches]]
name = "Mombasa Head Office"
town = "Mombasa"
code = "101"
[[branches]]
