rate_3_months = 8.0
rate_6_months = 8.75
rate_12_months = 9.5
interest_paid = "at maturity"
withholding_tax_on_interest = 15.0
rollover = "automatic for the same term at the rate on the rollover date, unless you tell us otherwise at least 2 working days before maturity"
early_withdrawal = "allowed; you lose half of the interest earned so far"
partial_withdrawal_allowed = false

[accounts.student]
name = "Kaskazi Student Account"
kind = "current"
audience = "Students aged 18 to 25 with a valid student ID from a university or college"
minimum_opening_balance = 0
monthly_fee = 0
debit_card_included = true
