# Account numbers: 13 digits. "0", the 3-digit branch code, an 8-digit serial and a check digit
# computed with the Luhn algorithm over the first 12 digits.
[account_number]
length = 13
format = "0 + branch code (3) + serial (8) + Luhn check digit (1)"

# --------------------------------------------------------------------------------------------
# Accounts
# --------------------------------------------------------------------------------------------

[accounts.everyday]
name = "Kaskazi Everyday Account"
kind = "current"
audience = "Individuals aged 18 and over"
minimum_opening_balance = 0
monthly_fee = 250
monthly_fee_waived_if = [
  "your salary is paid into the account that month",
  "your average balance for the month is KES 50,000 or more",
]
debit_card_included = true
cheque_book_25_leaves = 750
overdraft_available = false
interest_paid = false

[accounts.goal_saver]
name = "Kaskazi Goal Saver"
kind = "savings"
audience = "Individuals aged 18 and over"
minimum_opening_balance = 1000
monthly_fee = 0
interest_rate_high = 5.0               # on the whole balance when it is at or above the threshold
interest_rate_low = 3.0                # on the whole balance when it is below the threshold
interest_threshold = 10000
interest_calculated = "daily on the closing balance"
interest_paid = "monthly, on the last working day of the month"
withholding_tax_on_interest = 15.0     # deducted before interest is paid
free_withdrawals_per_month = 1
fee_per_extra_withdrawal = 150
maximum_goals = 5
debit_card_included = false

[accounts.fixed_deposit]
