<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kaskazi Bank is briefly unavailable</title>
<style>
  :root { color-scheme: light dark; --ink: #1d2340; --sand: #f6f1e7; --muted: #5b6078; --accent: #c4562b; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece7dc; --sand: #141829; --muted: #a7abc0; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--sand); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; }
  .banner { font-size: 14px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 12px; margin-bottom: 28px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.01em; }
  p { margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <p class="banner">Demonstration: an invented bank with sample data.</p>
  <h1>Kaskazi Bank is briefly unavailable</h1>
  <p>The site is restarting or being updated. Please try again in a minute.</p>
  <p>Nothing you did here is lost: your sample copy is kept for a day after you last use it.</p>
</main>
</body>
</html>
