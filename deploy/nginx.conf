# kaskazi.jeffgicharu.com
# Installed as /etc/nginx/sites-available/kaskazi.jeffgicharu.com by deploy/provision.sh.
#
# The site is static files (the React app) plus an API. No process renders pages: nginx serves
# the live release's index.html and the fingerprinted assets itself, and passes /api/ to the
# live slot's API. The model gateway is never reachable from here.
#
# A release switch rewrites two files, then reloads nginx once:
#   /etc/nginx/kaskazi/live-upstream.conf  the live API port (blue 8800, green 8801)
#   /etc/nginx/kaskazi/live-root.conf      the live release's folder of static files

upstream kaskazi_api {
    include /etc/nginx/kaskazi/live-upstream.conf;
    keepalive 16;
}

# Rate limits per visitor address. Requests from this machine are never limited (the release
# checks walk the site through nginx from 127.0.0.1): an empty key is not counted. A visitor
# can't arrive as 127.0.0.1, because the address comes from Cloudflare's header only on
# connections from Cloudflare's ranges (below).
geo $kaskazi_external {
    default 1;
    127.0.0.1 0;
    ::1 0;
}
map $kaskazi_external $kaskazi_limit_key {
    0 "";
    1 $binary_remote_addr;
}
limit_req_zone $kaskazi_limit_key zone=kaskazi_pages:10m rate=10r/s;
limit_req_zone $kaskazi_limit_key zone=kaskazi_api:10m rate=15r/s;
# Each chat message can call a model; the API also applies spending caps per visitor and address.
limit_req_zone $kaskazi_limit_key zone=kaskazi_chat:10m rate=12r/m;
limit_req_zone $kaskazi_limit_key zone=kaskazi_uploads:10m rate=6r/m;
limit_conn_zone $kaskazi_limit_key zone=kaskazi_streams:10m;

server {
    listen 80;
    listen [::]:80;
    server_name kaskazi.jeffgicharu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kaskazi.jeffgicharu.com;

    server_tokens off;
    charset utf-8;
    # Chat and console requests are small JSON documents. The document upload has its own limit.
    client_max_body_size 64k;

    # Cloudflare origin certificate shared by the sites on this server.
    ssl_certificate __ORIGIN_CERT__;
    ssl_certificate_key __ORIGIN_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/kaskazi.access.log;
    error_log /var/log/nginx/kaskazi.error.log;

    # The visitor's address, only when the connection comes from Cloudflare. Ranges read on
    # 29 October 2026 from https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/problem+json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # The API believes this header only from 127.0.0.1.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;

    # Defines $kaskazi_web, the live release's static folder.
    include /etc/nginx/kaskazi/live-root.conf;

    # If the API can't answer, visitors get the site's own page as a 503, so Cloudflare shows it
    # instead of its own error page.
    error_page 502 503 504 =503 /unavailable.html;
    location = /unavailable.html {
        root /var/www/kaskazi.jeffgicharu.com/shared/pages;
        include /etc/nginx/kaskazi/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        internal;
    }

    # Fingerprinted scripts, styles and fonts never change. Every kept release's files are here,
    # so a page loaded before a switch can still fetch what it asks for.
    location ^~ /assets/ {
        root /var/www/kaskazi.jeffgicharu.com/shared/static;
        include /etc/nginx/kaskazi/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Server-sent events: the customer's progress while the assistant works, and the console's
    # live queues. Exact locations, unbuffered, with a read timeout above the 20-second keep-alive.
    location = /api/stream {
        limit_conn kaskazi_streams 4;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_pass http://kaskazi_api;
    }
    location = /api/console/stream {
        limit_conn kaskazi_streams 4;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_pass http://kaskazi_api;
    }

    # A chat message. The assistant checks every answer before it is shown, which can take a
    # model call or three.
    location = /api/chat {
        limit_req zone=kaskazi_chat burst=6 nodelay;
        limit_req_status 429;
        proxy_read_timeout 40s;
        proxy_pass http://kaskazi_api;
    }

    # Sample documents for the document desk: PDF, PNG or JPEG, at most 3 MB.
    location = /api/documents {
        limit_req zone=kaskazi_uploads burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4m;
        proxy_read_timeout 60s;
        proxy_pass http://kaskazi_api;
    }

    location ^~ /api/ {
        limit_req zone=kaskazi_api burst=60 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
        proxy_pass http://kaskazi_api;
    }

    # The app's pages. Unknown paths get index.html, and the app shows its own not-found page.
    location / {
        limit_req zone=kaskazi_pages burst=40 nodelay;
        limit_req_status 429;
        root $kaskazi_web;
        include /etc/nginx/kaskazi/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
