# Security headers for the static files nginx serves itself (the API sends its own).
# Installed as /etc/nginx/kaskazi/security-headers.conf and included in each static location,
# because an add_header inside a location replaces the server's.
#
# The style-src hash is the unavailable page's inline <style> block, so that page (also the
# placeholder before the first release) keeps its look; tests/test_deploy.py keeps it in step.
#
# noindex everywhere: an invented bank turning up in search results could mislead real people.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-LteUPtDEt/ubJf6h+rfbkMFmsyJLZYAMwmOtsHlOU0k='; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
